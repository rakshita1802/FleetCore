services:
  mysql:
    image: mysql:8.0
    container_name: fleetcore-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fleetcore}
      MYSQL_USER: ${MYSQL_USER:-fleetuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleetpassword}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fleetuser", "-pfleetpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: fleetcore-redis
    restart: always
    ports:
      - '${REDIS_PORT:-6380}:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetcore-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://fleetuser:fleetpassword@mysql:3306/fleetcore
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-production_access_secret_key_fleetcore}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-production_refresh_secret_key_fleetcore}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5174,http://localhost:5173}
    ports:
      - '5000:5000'
    depends_on:
      - mysql
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetcore-worker
    command: npm run start:worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://fleetuser:fleetpassword@mysql:3306/fleetcore
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
      JOB_ATTEMPTS: 3
      JOB_BACKOFF_MS: 5000
      MAINTENANCE_EVALUATION_CRON: "*/15 * * * *"
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleetcore-frontend
    restart: always
    ports:
      - '${FRONTEND_PORT:-5174}:80'
    depends_on:
      - backend

volumes:
  mysql-data:
